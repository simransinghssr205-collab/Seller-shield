<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SellerShield</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Styles for the new order section only. Your style.css still controls the rest. */
    .section { margin-top: 24px; }
    .section h3 { margin: 0 0 8px; font-size: 15px; }
    .btn {
      background: #0b5a94;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #c9d3dc;
      border-radius: 6px;
      font-size: 13px;
    }
    .msg {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      word-break: break-word;
    }
    .msg.ok { display: block; background: #e3f6e3; color: #2d6a2d; }
    .msg.err { display: block; background: #fde8e8; color: #a33; }
    pre.result {
      margin: 12px 0 0;
      padding: 10px 12px;
      background: #f3f6f9;
      border-radius: 6px;
      font-size: 12px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SellerShield</h1>
    <p class="tagline">Protecting sellers from risky buyers.</p>

    <!-- 1. Connection test -->
    <div class="section">
      <h3>PayPal sandbox connection</h3>
      <button class="btn" id="testBtn">Test connection</button>
      <div class="msg" id="testMsg"></div>
    </div>

    <!-- 2. Create a sandbox order -->
    <div class="section">
      <h3>Sandbox orders</h3>
      <button class="btn" id="orderBtn">Create test order</button>
      <div class="msg" id="orderMsg"></div>

      <div class="row">
        <input id="orderIdInput" type="text" placeholder="Order ID" />
        <button class="btn" id="checkBtn">Check order</button>
      </div>
      <pre class="result" id="orderResult"></pre>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:5000";

    const TEST_ENDPOINT = "/api/paypal/test";

    const $ = (id) => document.getElementById(id);

    function showMsg(el, text, ok) {
      el.textContent = text;
      el.className = "msg " + (ok ? "ok" : "err");
    }

    async function callApi(path, options) {
      const res = await fetch(API_BASE + path, options);
      let data = {};
      try { data = await res.json(); } catch (e) { /* non-JSON reply */ }
      if (!res.ok) throw new Error(data.error || data.message || "Request failed (" + res.status + ")");
      return data;
    }

    // Test connection
    $("testBtn").addEventListener("click", async () => {
      const btn = $("testBtn");
      btn.disabled = true;
      try {
        const data = await callApi(TEST_ENDPOINT);
        showMsg($("testMsg"), data.message || "PayPal Sandbox connection successful!", true);
      } catch (err) {
        showMsg($("testMsg"), "Failed: " + err.message, false);
      } finally {
        btn.disabled = false;
      }
    });

    // Create test order
    $("orderBtn").addEventListener("click", async () => {
      const btn = $("orderBtn");
      btn.disabled = true;
      try {
        const data = await callApi("/api/create-order", { method: "POST" });
        $("orderIdInput").value = data.id;
        showMsg($("orderMsg"), "Order " + data.id + " created (" + data.status + "). Approve it in the new tab with a sandbox buyer account, then click Check order.", true);
        if (data.approve_url) window.open(data.approve_url, "_blank");
      } catch (err) {
        showMsg($("orderMsg"), "Failed: " + err.message, false);
      } finally {
        btn.disabled = false;
      }
    });

    // Check an order
    $("checkBtn").addEventListener("click", async () => {
      const id = $("orderIdInput").value.trim();
      const out = $("orderResult");
      if (!id) {
        showMsg($("orderMsg"), "Enter an order ID first.", false);
        return;
      }
      const btn = $("checkBtn");
      btn.disabled = true;
      try {
        const data = await callApi("/api/order/" + encodeURIComponent(id));
        out.textContent = JSON.stringify(data, null, 2);
        out.style.display = "block";
        showMsg($("orderMsg"), "Order status: " + data.status, true);
      } catch (err) {
        out.style.display = "none";
        showMsg($("orderMsg"), "Failed: " + err.message, false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
